# 10.4 Legacy compatibility (SR app matching is filtered for Clash)
RULE-SET,https://raw.githubusercontent.com/kenrickxu/SR/main/rules/CNCompatibility04.list,🇯🇵 JP REA

# 10.5 Legacy compatibility (SR app matching is filtered for Clash)
RULE-SET,https://raw.githubusercontent.com/kenrickxu/SR/main/rules/CNCompatibility05.list,DIRECT

# 10.6 Legacy compatibility (SR app matching is filtered for Clash)
