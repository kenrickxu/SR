# 11. Existing UDP media port compatibility (after explicit services)
AND,((PROTOCOL,UDP),(DST-PORT,3478-3497)),DIRECT
AND,((PROTOCOL,UDP),(DST-PORT,16384-16387)),DIRECT
AND,((PROTOCOL,UDP),(DST-PORT,16393-16402)),DIRECT

# 12. 🇯🇵 JP REA IP fallback after service domains
