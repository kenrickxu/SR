# Keep DIRECT lookups on system DNS and never retry them through PROXY DNS.
dns-direct-system = true
dns-direct-fallback-proxy = false
# Shadowrocket 2.2.93: explicit Enable Fallback switch; system guard alone is insufficient.
dns-fallback = false
dns-fallback-system = false
# Explicitly clear the fallback DNS list when importing/updating this profile.
fallback-dns-server =
icmp-auto-reply = true
always-reject-url-rewrite = true
private-ip-answer = true
use-local-host-item-for-proxy = true
tcp-fast-open = true
bypass-system = true
udp-policy-not-supported-behaviour = reject
dns-server = 223.5.5.5,223.6.6.6
# Intercept apps hard-coding Google DNS; these are destinations, not upstream resolvers.
hijack-dns = 8.8.8.8:53,8.8.4.4:53
update-url = https://raw.githubusercontent.com/kenrickxu/SR/refs/heads/main/CN.conf
ipv6 = false

[Proxy Group]
🇯🇵 JP REA = select,🇯🇵JP-Reality
🇺🇸 US REA = select,🇺🇸US-Reality

[Rule]
# CN_RULESET_AUTHORITY_V1: native Clash imports this complete CN order

# 1. Local remote-access processes
PROCESS-NAME,Jump Desktop,DIRECT
PROCESS-NAME,JumpConnect,DIRECT
PROCESS-NAME,UURemote,DIRECT
PROCESS-NAME,UURemoteDaemon,DIRECT
PROCESS-NAME,UURemoteServer,DIRECT
PROCESS-NAME,UURemoteService,DIRECT

# 2. Video transport compatibility: only Googlevideo UDP/443; TCP remains JP
AND,((PROTOCOL,UDP),(DST-PORT,443),(DOMAIN-SUFFIX,googlevideo.com)),REJECT

# 3. Service exceptions before parent DIRECT
DOMAIN-SUFFIX,push.apple.com,🇯🇵 JP REA

# 4. Core national games DIRECT
RULE-SET,https://raw.githubusercontent.com/kenrickxu/SR/main/rules/CNCoreGamesDirect.list,DIRECT

# 5. Apple push / Telegram official IP priority JP
RULE-SET,https://raw.githubusercontent.com/kenrickxu/SR/main/rules/CNPushTelegramJP.list,🇯🇵 JP REA

# 6. Other mainland games DIRECT
RULE-SET,https://raw.githubusercontent.com/kenrickxu/SR/main/rules/CNOtherGamesDirect.list,DIRECT

# 7. Explicit US businesses / downloads (US Reality)
RULE-SET,https://raw.githubusercontent.com/kenrickxu/SR/main/rules/CNServiceUS.list,🇺🇸 US REA

# 8. Explicit JP banks / apps / video
RULE-SET,https://raw.githubusercontent.com/kenrickxu/SR/main/rules/CNServiceJP.list,🇯🇵 JP REA

# 9. Mainland and approved parent domains DIRECT
RULE-SET,https://raw.githubusercontent.com/kenrickxu/SR/main/rules/CNMainlandDirect.list,DIRECT

# 10.1 Legacy compatibility (SR app matching is filtered for Clash)
RULE-SET,https://raw.githubusercontent.com/kenrickxu/SR/main/rules/CNCompatibility01.list,DIRECT

# 10.2 Legacy compatibility (SR app matching is filtered for Clash)
RULE-SET,https://raw.githubusercontent.com/kenrickxu/SR/main/rules/CNCompatibility02.list,🇯🇵 JP REA

# 10.3 Legacy compatibility (SR app matching is filtered for Clash)
RULE-SET,https://raw.githubusercontent.com/kenrickxu/SR/main/rules/CNCompatibility03.list,🇺🇸 US REA

# 10.4 Legacy compatibility (SR app matching is filtered for Clash)
RULE-SET,https://raw.githubusercontent.com/kenrickxu/SR/main/rules/CNCompatibility04.list,🇯🇵 JP REA

# 10.5 Legacy compatibility (SR app matching is filtered for Clash)
RULE-SET,https://raw.githubusercontent.com/kenrickxu/SR/main/rules/CNCompatibility05.list,DIRECT

# 10.6 Legacy compatibility (SR app matching is filtered for Clash)
RULE-SET,https://raw.githubusercontent.com/kenrickxu/SR/main/rules/CNCompatibility06.list,🇯🇵 JP REA

# 11. Existing UDP media port compatibility (after explicit services)
AND,((PROTOCOL,UDP),(DST-PORT,3478-3497)),DIRECT
AND,((PROTOCOL,UDP),(DST-PORT,16384-16387)),DIRECT
AND,((PROTOCOL,UDP),(DST-PORT,16393-16402)),DIRECT

# 12. 🇯🇵 JP REA IP fallback after service domains
RULE-SET,https://raw.githubusercontent.com/kenrickxu/SR/main/rules/CNIPJP.list,🇯🇵 JP REA

# 12. 🇺🇸 US REA IP fallback after service domains
RULE-SET,https://raw.githubusercontent.com/kenrickxu/SR/main/rules/CNIPUS.list,🇺🇸 US REA

# 12. DIRECT IP fallback after service domains
RULE-SET,https://raw.githubusercontent.com/kenrickxu/SR/main/rules/CNIPDirect.list,DIRECT

# 13. Mainland ASN / GeoIP; explicit final JP
IP-ASN,132203,DIRECT,no-resolve
GEOIP,CN,DIRECT
FINAL,🇯🇵 JP REA

