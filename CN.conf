# PROXY uses only the two AliDNS resolvers. DIRECT uses system DNS only;
# there is no fallback DNS pool or direct-to-proxy DNS fallback.
# Keep DIRECT lookups on system DNS and never retry them through PROXY DNS.
dns-direct-system = true
dns-direct-fallback-proxy = false
# Shadowrocket 2.2.93: explicit Enable Fallback switch; system guard alone is insufficient.
dns-fallback = false
dns-fallback-system = false
# Explicitly clear the fallback DNS list when importing/updating this profile.
fallback-dns-server =
icmp-auto-reply = true
always-reject-url-rewrite = false
private-ip-answer = true
use-local-host-item-for-proxy = true
tcp-fast-open = true
bypass-system = true
udp-policy-not-supported-behaviour = reject
dns-server = 223.5.5.5,223.6.6.6
# Intercept apps hard-coding Google DNS; these are destinations, not upstream resolvers.
hijack-dns = 8.8.8.8:53,8.8.4.4:53
update-url = https://sr-config.kt7766.org/CN.conf
ipv6 = false

prefer-ipv6 = false



[Proxy Group]
🇯🇵 JP REA = select,🇯🇵JP-Reality
🇺🇸 US REA = select,🇺🇸US-Reality

[Rule]
# CN_CHINA_DIRECT_V1: owner exceptions, mainland direct, default proxy
# Local/private destinations and CNR management isolation


# Explicit proxy groups: US exceptions before JP; CNR maps both to US
RULE-SET,https://sr-config.kt7766.org/rules/USProxy.list,🇺🇸 US REA
RULE-SET,https://sr-config.kt7766.org/rules/JPProxy.list,🇯🇵 JP REA

# Mainland domains/IPs direct; other destinations use the profile default
RULE-SET,https://sr-config.kt7766.org/rules/ChinaDirectDomains.list,DIRECT
GEOIP,CN,DIRECT
FINAL,🇯🇵 JP REA

[Host]
localhost = 127.0.0.1

[MITM]
ca-passphrase = GV0dyca4
ca-p12 = 
enable = true
